<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Audio Analyzer</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>🎤 Audio Analyzer</h1>

        <hr>

        <h2>Upload Audio</h2>

        <input type="file" id="audioFile" accept="audio/*">

        <button onclick="uploadAudio()">
            Upload & Transcribe
        </button>

        <hr>

        <h2>Live Microphone</h2>

        <button id="startBtn">
            Start Recording
        </button>

        <button id="stopBtn" disabled>
            Stop Recording
        </button>

        <hr>

        <h3>Transcription Result</h3>

        <div id="result"></div>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
